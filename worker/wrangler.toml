name = "nanasore"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Routes et Domaines personnalisés
routes = [
  { pattern = "nanasore.com/*", zone_name = "nanasore.com" },
  { pattern = "*.nanasore.com/*", zone_name = "nanasore.com" },
  { pattern = "nsore.shop/*", zone_name = "nsore.shop" },
  { pattern = "*.nsore.shop/*", zone_name = "nsore.shop" }
]

# Variables d'environnement globales
[vars]
ENVIRONMENT = "production"
APP_NAME = "Nanasore Edge Router & Stock Circuit Breaker"
BACKEND_URL = "nanaswitch-bot-render-0kqp.onrender.com"
RENDER_BACKEND_URL = "nanaswitch-bot-render-0kqp.onrender.com"
NORTHFLANK_BACKEND_URL = "p02--nanaswitch-bot--p8yx28yyjhbx.code.run"
PAYMENT_API_URL = "https://nanaswitch-bot-render-0kqp.onrender.com"
LIVE_WHIP_URL = "https://p01--nanasore-live--p8yx28yyjhbx.code.run"
LIVE_HLS_URL = "https://p02--nanasore-live--p8yx28yyjhbx.code.run"

# Liaison Cloudflare KV pour le cache et circuit breaker de stock temps réel à l'Edge
[[kv_namespaces]]
binding = "PRODUCT_STOCK_KV"
id = "272d12f5380f4e2aae672596f6388d25"
preview_id = "a13b09dc328c45ab9997020e226c5b2b"
