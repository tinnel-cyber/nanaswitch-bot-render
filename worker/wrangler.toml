name = "nanasore"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Routes et Domaines personnalisés
routes = [
  { pattern = "nanasore.com/*", zone_name = "nanasore.com" },
  { pattern = "*.nanasore.com/*", zone_name = "nanasore.com" }
]

# Variables d'environnement globales
[vars]
ENVIRONMENT = "production"
APP_NAME = "Nanasore Edge Router & Stock Circuit Breaker"
RENDER_BACKEND_URL = "nanasore.onrender.com"

# Liaison Cloudflare KV pour le cache et circuit breaker de stock temps réel à l'Edge
[[kv_namespaces]]
binding = "PRODUCT_STOCK_KV"
id = "272d12f5380f4e2aae672596f6388d25"
preview_id = "a13b09dc328c45ab9997020e226c5b2b"
