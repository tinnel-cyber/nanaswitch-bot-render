<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="posBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="45%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="posAccent" x1="120" y1="90" x2="392" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
  </defs>

  <!-- Fond arrondi squircle -->
  <rect width="512" height="512" rx="116" fill="url(#posBg)" />
  <rect x="14" y="14" width="484" height="484" rx="104" stroke="#60A5FA" stroke-opacity="0.22" stroke-width="4" />

  <!-- Ticket thermique sortant du haut -->
  <path d="M176 154V94C176 85.1634 183.163 78 192 78H320C328.837 78 336 85.1634 336 94V154H176Z" fill="#F8FAFC" />
  <rect x="200" y="102" width="112" height="12" rx="6" fill="#1E3A8A" fill-opacity="0.85" />
  <rect x="200" y="124" width="74" height="10" rx="5" fill="#64748B" fill-opacity="0.55" />

  <!-- Corps du Terminal POS -->
  <rect x="116" y="148" width="280" height="278" rx="40" fill="#FFFFFF" />
  <rect x="128" y="160" width="256" height="254" rx="30" fill="#F1F5F9" />

  <!-- Écran tactile du Terminal -->
  <rect x="148" y="178" width="216" height="96" rx="18" fill="#0F172A" />
  <!-- Montant / Badge sur écran -->
  <rect x="166" y="198" width="102" height="14" rx="7" fill="url(#posAccent)" />
  <rect x="166" y="224" width="64" height="10" rx="5" fill="#94A3B8" fill-opacity="0.6" />
  <!-- Symbole Contactless / NFC sur l'écran -->
  <path d="M312 214C317.5 219.5 317.5 232.5 312 238" stroke="#22D3EE" stroke-width="6" stroke-linecap="round" />
  <path d="M326 204C336 214 336 238 326 248" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
  <path d="M340 194C354.5 208.5 354.5 243.5 340 258" stroke="#60A5FA" stroke-width="6" stroke-linecap="round" />

  <!-- Pavé numérique POS (3x3) + bouton validation émeraude -->
  <rect x="152" y="294" width="44" height="28" rx="8" fill="#CBD5E1" />
  <rect x="208" y="294" width="44" height="28" rx="8" fill="#CBD5E1" />
  <rect x="264" y="294" width="44" height="28" rx="8" fill="#CBD5E1" />

  <rect x="152" y="332" width="44" height="28" rx="8" fill="#CBD5E1" />
  <rect x="208" y="332" width="44" height="28" rx="8" fill="#CBD5E1" />
  <rect x="264" y="332" width="44" height="28" rx="8" fill="#CBD5E1" />

  <rect x="152" y="370" width="44" height="28" rx="8" fill="#CBD5E1" />
  <rect x="208" y="370" width="44" height="28" rx="8" fill="#CBD5E1" />
  <rect x="264" y="370" width="44" height="28" rx="8" fill="#CBD5E1" />

  <!-- Bouton Encaisser Vert Émeraude -->
  <rect x="320" y="294" width="42" height="104" rx="12" fill="#10B981" />
  <path d="M332 346L339 353L351 339" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
